name: aql-network

# AQL network stack:
#   - coordinator: AI (OpenAI-compatible API), accounts, pricing, jobs, epochs (port 9000)
#   - web:         the public website (port 8088) — in production, published on Vercel
# Optional profiles:
#   --profile oracle:    an oracle (votes on epochs on-chain); one per operator
#   --profile miner:     mining nodes (local Ollama model + GPU miner + storage)
#   --profile workspace: the Odysseus workspace (ai/), which can be plugged into the network
#                        as an OpenAI-compatible model provider

services:
  odysseus:
    profiles: ["workspace"]
    build: ./ai
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-7000}:7000"
    volumes:
      - ./data:/app/data:z
      - ./logs:/app/logs:z
      - ./data/ssh:/app/.ssh:z
      - ./data/huggingface:/app/.cache/huggingface:z
      - ./data/local:/app/.local:z
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - LLM_HOST=${LLM_HOST:-localhost}
      - LLM_HOSTS=${LLM_HOSTS:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-}
      - RESEARCH_LLM_ENDPOINT=${RESEARCH_LLM_ENDPOINT:-}
      - HF_TOKEN=${HF_TOKEN:-}
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
      - SEARXNG_INSTANCE=http://searxng:8080
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./data/app.db}
      - AUTH_ENABLED=${AUTH_ENABLED:-true}
      - LOCALHOST_BYPASS=${LOCALHOST_BYPASS:-false}
      - ODYSSEUS_ADMIN_USER=${ODYSSEUS_ADMIN_USER:-admin}
      - ODYSSEUS_ADMIN_PASSWORD=${ODYSSEUS_ADMIN_PASSWORD:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1}
      - SECURE_COOKIES=${SECURE_COOKIES:-false}
      - EMBEDDING_URL=${EMBEDDING_URL:-}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      - FASTEMBED_MODEL=${FASTEMBED_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      - FASTEMBED_CACHE_PATH=${FASTEMBED_CACHE_PATH:-}
      - CLEANUP_INTERVAL_HOURS=${CLEANUP_INTERVAL_HOURS:-24}
      - ODYSSEUS_INPROCESS_POLLERS=${ODYSSEUS_INPROCESS_POLLERS:-1}
      - ODYSSEUS_INPROCESS_TASKS=${ODYSSEUS_INPROCESS_TASKS:-1}
      - ODYSSEUS_SCRIPT_HOST=${ODYSSEUS_SCRIPT_HOST:-localhost}
      - DATA_BRAVE_API_KEY=${DATA_BRAVE_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GOOGLE_PSE_CX=${GOOGLE_PSE_CX:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - SERPER_API_KEY=${SERPER_API_KEY:-}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    depends_on:
      searxng:
        condition: service_healthy
      chromadb:
        condition: service_started
    restart: unless-stopped

  chromadb:
    profiles: ["workspace"]
    image: docker.io/chromadb/chroma:latest
    ports:
      - "${CHROMADB_BIND:-127.0.0.1}:8100:8000"
    volumes:
      - chromadb-data:/chroma/chroma
    environment:
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped

  searxng:
    profiles: ["workspace"]
    # Pinned, not :latest — odysseus waits for the searxng healthcheck.
    image: docker.io/searxng/searxng:2026.5.31-7159b8aed
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        if [ ! -s /etc/searxng/settings.yml ] || grep -q 'odysseus-local-searxng-json-2026-05-30\|__SEARXNG_SECRET__' /etc/searxng/settings.yml; then
          secret="$${SEARXNG_SECRET:-}"
          if [ -z "$$secret" ]; then
            secret="$$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          fi
          sed "s|__SEARXNG_SECRET__|$$secret|g" /tmp/searxng-settings.yml.template > /etc/searxng/settings.yml
        fi
        exec /usr/local/searxng/entrypoint.sh
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - searxng-data:/etc/searxng
      - ./ai/config/searxng/settings.yml:/tmp/searxng-settings.yml.template:ro,z
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
      - SEARXNG_SECRET=${SEARXNG_SECRET:-}
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/', timeout=5).read(1)\""]
      interval: 5s
      timeout: 6s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  ntfy:
    profiles: ["workspace"]
    image: docker.io/binwiederhier/ntfy
    command: serve
    ports:
      - "${NTFY_BIND:-127.0.0.1}:8091:80"
    volumes:
      - ntfy-cache:/var/cache/ntfy
    environment:
      - NTFY_BASE_URL=${NTFY_BASE_URL:-http://localhost:8091}
    restart: unless-stopped

  coordinator:
    build: ./network/coordinator
    ports:
      - "${COORDINATOR_BIND:-127.0.0.1}:${COORDINATOR_PORT:-9000}:9000"
    volumes:
      # Coordinator database and epoch settlements (roots + public proofs).
      - ./data/coordinator:/app/data:z
      - ./data/settlements:/app/settlements:z
    environment:
      - COORDINATOR_ADMIN_TOKEN=${COORDINATOR_ADMIN_TOKEN:-}
      # GENESIS_TS: same value as in the contract (printed by `npm run deploy`).
      - GENESIS_TS=${GENESIS_TS:-0}
      - NETWORK_MODEL=${NETWORK_MODEL:-qwen2.5:7b-instruct}
      - RPC_URL=${RPC_URL:-}
      - AQL_NETWORK_ADDRESS=${AQL_NETWORK_ADDRESS:-}
      - CHAIN_START_BLOCK=${CHAIN_START_BLOCK:-0}
      - CHAIN_CONFIRMATIONS=${CHAIN_CONFIRMATIONS:-3}
      - PRICE_START_MICRO=${PRICE_START_MICRO:-2000000}
      - REQUESTS_PER_MINUTE=${REQUESTS_PER_MINUTE:-30}
      - VERIFY_SAMPLE_RATE=${VERIFY_SAMPLE_RATE:-0.05}
      - BENCH_INTERVAL_SECONDS=${BENCH_INTERVAL_SECONDS:-7200}
      - BENCH_REFERENCES=${BENCH_REFERENCES:-[]}
      - GPU_POOL_BPS=${GPU_POOL_BPS:-7000}
      - STORAGE_REPLICATION=${STORAGE_REPLICATION:-3}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-*}
    restart: unless-stopped

  web:
    image: docker.io/nginx:alpine
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8088}:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro,z
    restart: unless-stopped


  # ---- Oracle profile: automatic on-chain publication of epochs ----

  oracle:
    profiles: ["oracle"]
    build:
      context: ./contracts
      dockerfile: Dockerfile.oracle
    environment:
      # Each oracle operator runs on THEIR OWN machine and points to the public
      # coordinator (https://api.<domain>); the default value is for local testing.
      - COORDINATOR_URL=${COORDINATOR_URL:-http://coordinator:9000}
      - COORDINATOR_ADMIN_TOKEN=${COORDINATOR_ADMIN_TOKEN:-}
      - RPC_URL=${RPC_URL:-}
      - ORACLE_PRIVATE_KEY=${ORACLE_PRIVATE_KEY:-}
      - AQL_NETWORK_ADDRESS=${AQL_NETWORK_ADDRESS:-}
      - POLL_SECONDS=${ORACLE_POLL_SECONDS:-300}
    volumes:
      - oracle-state:/state
    restart: unless-stopped

  # ---- Miner profile: mining nodes on this machine ----

  ollama:
    profiles: ["miner"]
    image: docker.io/ollama/ollama:latest
    # Starts the server, then downloads the network model (only once; it is
    # kept in the volume). NVIDIA GPU: add a device reservation; see
    # ai/docker/gpu.nvidia.yml for the syntax.
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 5; ollama pull \"$$NETWORK_MODEL\"; wait"]
    environment:
      - NETWORK_MODEL=${NETWORK_MODEL:-qwen2.5:7b-instruct}
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

  gpu-miner:
    profiles: ["miner"]
    build: ./network/miner
    command:
      - "--wallet"
      # If empty, the miner refuses to start and prints a clear message.
      - "${MINER_WALLET:-}"
      - "--mode"
      - "gpu"
      - "--coordinator"
      - "http://coordinator:9000"
      - "--name"
      - "gpu-miner"
      - "--state-file"
      - "/state/miner_state.json"
    environment:
      # Model server: the ollama service above by default.
      - MODEL_ENDPOINT=${MINER_MODEL_ENDPOINT:-http://ollama:11434/v1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - gpu-miner-state:/state
    depends_on:
      coordinator:
        condition: service_started
      ollama:
        condition: service_started
    restart: unless-stopped

  storage-node:
    profiles: ["miner"]
    build: ./network/miner
    command:
      - "--wallet"
      # If empty, the miner refuses to start and prints a clear message.
      - "${MINER_WALLET:-}"
      - "--mode"
      - "storage"
      - "--allocate-gb"
      - "${MINER_STORAGE_GB:-50}"
      - "--storage-path"
      - "/storage"
      - "--coordinator"
      - "http://coordinator:9000"
      - "--name"
      - "storage-node"
      - "--state-file"
      - "/state/miner_state.json"
    volumes:
      - storage-node-data:/storage
      - storage-node-state:/state
    depends_on:
      coordinator:
        condition: service_started
    restart: unless-stopped

volumes:
  searxng-data:
  chromadb-data:
  ntfy-cache:
  oracle-state:
  ollama-models:
  gpu-miner-state:
  storage-node-data:
  storage-node-state:
